[project]
name = "forge-mind"
version = "0.1.0"
description = "Hierarchical Multi-Agent Cognitive Operating System"
readme = "docs/PROJECT.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "jsonschema>=4.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # M3-B (ADR-010): Gemini 3.5 via Vertex AI, called lazily inside
    # forgemind.llm.adapter. Runtime dependency (NOT dev) — it is required
    # in the Cloud Run image so the bounded Gemini node can run.
    "google-genai>=2.19.0",
    # ADK 2.0 integration layer (google-adk). Imported lazily inside
    # forgemind.adk_app so the package boots cleanly without it (ADR-009
    # import-boundary invariant). Required only when FORGEMIND_RUNTIME=adk.
    "google-adk>=2.0.0",
]

[build-system]
# Required so tooling (pip / uv / Docker) can build & install forge-mind
# as a real package from the src/ layout; without it uv treats the
# project as virtual and never installs it into the venv/image.
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
# Optional extras (none currently). Dev tooling lives in [dependency-groups].

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ggshield>=1.53.0",
    "specify-cli>=1.0.1",
    # Dev-time Knowledge Brain index only — NOT runtime state (ADR-009).
    # ChromaDB provides CONTEXT, not AUTHORITY. Never move this to
    # [project].dependencies: no runtime tier may depend on it.
    "chromadb>=0.5.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
